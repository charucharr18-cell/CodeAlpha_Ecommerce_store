{% extends 'store/base.html' %}

{% block title %}Sign In | AuraStore{% endblock %}

{% block content %}

<div class="form-card">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h2 style="font-size: 1.8rem; font-weight: 800;">Welcome Back</h2>
        <p style="color: var(--text-secondary); font-size: 0.95rem; margin-top: 0.4rem;">
            Sign in to access your saved cart, profile, and order history.
        </p>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label class="form-label" for="id_username">Username</label>
            <input type="text" name="username" id="id_username" class="form-control" required autofocus placeholder="Enter your username">
        </div>

        <div class="form-group">
            <label class="form-label" for="id_password">Password</label>
            <input type="password" name="password" id="id_password" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-gradient" style="width: 100%; padding: 0.9rem; font-size: 1rem; margin-top: 1rem;">
            <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
    </form>

    <div style="text-align: center; margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
        Don't have an account? <a href="{% url 'accounts:register' %}" style="color: var(--accent-primary); font-weight: 600;">Create One Now</a>
    </div>
</div>

{% endblock %}
